name: CI

on:
  # Build on every commit pushed to every branch and every tag.
  push:
    branches:
      - '**'
    tags:
      - '**'

  # Build on pull requests.
  pull_request:

  # Build when a PR enters GitHub's merge queue.
  merge_group:

  # Manual verification from GitHub web/mobile.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Java 8 / Spigot 1.8.8
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java 8
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      # Node is not a plugin runtime dependency.
      # It is used only for modern repository tooling checks.
      - name: Set up current Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '26'
          check-latest: true
          package-manager-cache: false

      - name: Print toolchain versions
        run: |
          java -version
          mvn --version
          node --version
          npm --version

      - name: Read project version
        id: project-version
        shell: bash
        run: |
          set -euo pipefail

          version="$(mvn --batch-mode --no-transfer-progress \
            help:evaluate \
            -Dexpression=project.version \
            -q \
            -DforceStdout)"

          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid project version: $version"
            exit 1
          }

          echo "Project version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Verify version consistency
        shell: bash
        run: |
          set -euo pipefail

          plugin_yml_version="$(
            sed -n 's/^version:[[:space:]]*//p' \
              src/main/resources/plugin.yml | head -n 1
          )"

          echo "pom.xml version:     $PROJECT_VERSION"
          echo "plugin.yml version: $plugin_yml_version"

          [[ "$PROJECT_VERSION" == "$plugin_yml_version" ]] || {
            echo "Version mismatch between pom.xml and plugin.yml."
            exit 1
          }

      - name: Build plugin
        run: |
          mvn --batch-mode --no-transfer-progress clean package

      - name: Verify plugin descriptor
        shell: bash
        run: |
          set -euo pipefail

          JAR="target/transparent-audit-${PROJECT_VERSION}.jar"

          test -f "$JAR"

          echo "Verifying $JAR"

          jar tf "$JAR" | grep -Fx 'plugin.yml'

          jar tf "$JAR" | grep -F \
            'com/notgamingop/transparentaudit/TransparentAudit.class'

          descriptor_version="$(
            unzip -p "$JAR" plugin.yml |
              sed -n 's/^version:[[:space:]]*//p' |
              head -n 1
          )"

          echo "JAR plugin.yml version: $descriptor_version"

          [[ "$PROJECT_VERSION" == "$descriptor_version" ]] || {
            echo "Version mismatch inside built JAR."
            exit 1
          }

      - name: Verify Java 8 bytecode
        shell: bash
        run: |
          set -euo pipefail

          major="$(
            javap -verbose \
              target/classes/com/notgamingop/transparentaudit/TransparentAudit.class |
              awk '/major version/ {print $3; exit}'
          )"

          echo "Class-file major version: $major"

          test "$major" = "52"

      - name: Upload JAR
        uses: actions/upload-artifact@v7.0.1
        with:
          name: TransparentAudit-${{ steps.project-version.outputs.version }}-${{ github.run_id }}
          path: target/transparent-audit-${{ steps.project-version.outputs.version }}.jar
          if-no-files-found: error